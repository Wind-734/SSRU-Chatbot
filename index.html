<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSRU Chatbot - มหาวิทยาลัยราชภัฏสวนสุนันทา</title>

  <!-- Google Fonts: Prompt & Kanit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="public/css/style.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Configuration อิงจากตัวแปร CSS ของคุณ -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Kanit', 'sans-serif'],
          },
          colors: {
            sidebar: {
              bg: '#0B132B',
              hover: '#162244',
              active: '#1C2B54',
              text: '#FFFFFF',
              title: '#94A3B8'
            },
            primary: {
              pink: '#FF4B8B',
              hover: '#E83B79',
            },
            chat: {
              userBg: '#F78DA7',
              mainBg: '#F8FAFC',
            }
          },
          animation: {
            'typing': 'typingBounce 1.4s infinite ease-in-out both',
            'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
          },
          keyframes: {
            typingBounce: {
              '0%, 80%, 100%': { transform: 'scale(0.6)', opacity: '0.5' },
              '40%': { transform: 'scale(1)', opacity: '1' },
            },
            fadeIn: {
              'from': { opacity: '0', transform: 'translateY(8px)' },
              'to': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>

  <!-- จัดการ Scrollbar ที่ Tailwind CDN ไม่รองรับโดยตรง -->
  <style>
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(203, 213, 225, 1);
      border-radius: 4px;
    }

    .sidebar-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .sidebar-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
  </style>
</head>

<body class="bg-chat-mainBg text-slate-800 font-sans h-screen overflow-hidden flex antialiased">

  <!-- Sidebar -->
  <aside
    class="w-[280px] bg-sidebar-bg flex-col h-full flex-shrink-0 z-[100] border-r border-white/5 transition-transform duration-300 hidden md:flex"
    id="sidebar">
    <div class="px-5 pt-6 pb-4">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full text-primary-pink flex items-center justify-center text-lg">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <span class="text-lg font-semibold text-white tracking-[0.3px]">SSRU Chatbot</span>
      </div>
    </div>

    <!-- New Chat Button -->
    <div class="px-4 pb-4">
      <button
        class="w-full py-3 px-5 bg-gradient-to-br from-[#FF4B8B] to-[#F43F5E] text-white rounded-full font-medium flex items-center justify-center gap-2.5 shadow-[0_4px_14px_rgba(255,75,139,0.35)] hover:-translate-y-[1px] hover:shadow-[0_6px_20px_rgba(255,75,139,0.5)] active:translate-y-0 transition-all duration-200"
        id="btn-new-chat">
        <i class="fa-solid fa-plus"></i>
        <span>การสนทนาใหม่</span>
      </button>
    </div>

    <!-- Chat History Section -->
    <div class="flex-1 overflow-y-auto px-3 py-3 flex flex-col sidebar-scrollbar">
      <div class="text-[11px] font-semibold text-sidebar-title tracking-[0.8px] px-3 mb-1">CHAT HISTORY</div>
      <ul class="flex flex-col gap-1 list-none" id="history-list">
        <!-- ตัวอย่าง History Item -->
        <li
          class="flex items-center gap-3 px-3.5 py-3 rounded-[10px] text-sidebar-text cursor-pointer transition-colors duration-200 hover:bg-sidebar-hover hover:text-white group">
          <i class="fa-regular fa-message text-[14px] text-slate-500 flex-shrink-0 group-hover:text-primary-pink"></i>
          <span class="flex-1 whitespace-nowrap overflow-hidden text-ellipsis text-sm">การลงทะเบียนเรียน</span>
        </li>
      </ul>
    </div>

    <!-- Sidebar Footer -->
    <div class="p-4 border-t border-white/10 flex items-center justify-between bg-black/15">
      <div class="flex items-center gap-3 overflow-hidden">
        <div
          class="w-9 h-9 rounded-full bg-primary-pink text-white flex items-center justify-center font-semibold text-[15px] flex-shrink-0">
          R
        </div>
        <div class="flex flex-col overflow-hidden">
          <span class="text-[13px] font-medium text-white whitespace-nowrap overflow-hidden text-ellipsis">Rattanawut
            Kerdl...</span>
          <span class="text-[11px] text-sidebar-title whitespace-nowrap overflow-hidden text-ellipsis">ID:
            67122202083</span>
        </div>
      </div>
      <button
        class="text-slate-500 hover:text-white hover:bg-white/10 text-base cursor-pointer p-2 rounded-md transition-colors"
        title="ออกจากระบบ" id="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </aside>

  <!-- Overlay for mobile sidebar toggle -->
  <div class="fixed inset-0 bg-slate-900/50 backdrop-blur-[2px] z-90 hidden" id="sidebar-overlay"></div>

  <!-- Main Chat Content -->
  <main class="flex-1 flex flex-col h-full bg-chat-mainBg relative overflow-hidden">

    <!-- Top Header -->
    <header
      class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 flex-shrink-0 shadow-[0_1px_3px_rgba(0,0,0,0.02)]">
      <div class="flex items-center gap-3.5">
        <button class="md:hidden text-lg text-slate-600 cursor-pointer p-1.5 bg-transparent border-none"
          id="mobile-toggle">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="w-[38px] h-[38px] rounded-full bg-sidebar-bg text-white flex items-center justify-center text-lg">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="flex flex-col">
          <h1 class="text-base font-semibold text-slate-900 leading-[1.2]">SSRU Chatbot</h1>
          <p class="text-xs text-slate-500 font-normal">Suan Sunandha Rajabhat University</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1.5 text-xs text-slate-500 bg-slate-100 px-2.5 py-1 rounded-[14px]">
          <span
            class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_0_2px_rgba(16,185,129,0.2)] animate-pulse"></span>
          <span>ออนไลน์</span>
        </div>
        <button
          class="text-slate-500 hover:bg-slate-100 hover:text-slate-900 text-[15px] cursor-pointer p-2 rounded-full transition-colors"
          id="btn-clear-chat" title="ล้างการสนทนา">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
      </div>
    </header>

    <!-- Chat Messages Scrollable Area -->
    <div class="flex-1 overflow-y-auto p-6 flex flex-col gap-5 scroll-smooth custom-scrollbar" id="chat-messages">
    </div>

    <!-- Quick Prompt Suggestions -->
    <div class="px-6 pb-3 w-full max-w-[900px] mx-auto" id="quick-prompts-container">
      <div class="text-xs font-medium text-slate-500 mb-2">คำถามแนะนำ:</div>
      <div class="flex gap-2 overflow-x-auto pb-1.5 custom-scrollbar">
        <button
          class="prompt-chip bg-white border border-slate-200 rounded-[20px] px-3.5 py-2 text-[13px] text-slate-700 whitespace-nowrap flex items-center gap-1.5 transition-all duration-200 shadow-[0_1px_2px_rgba(0,0,0,0.03)] hover:border-primary-pink hover:bg-pink-50 hover:text-primary-pink hover:-translate-y-[1px]"
          data-prompt="การลงทะเบียนเรียนภาคเรียนที่ 2">
          <i class="fa-regular fa-calendar-check text-primary-pink text-xs"></i> การลงทะเบียนเรียนภาคเรียน
        </button>
        <button
          class="prompt-chip bg-white border border-slate-200 rounded-[20px] px-3.5 py-2 text-[13px] text-slate-700 whitespace-nowrap flex items-center gap-1.5 transition-all duration-200 shadow-[0_1px_2px_rgba(0,0,0,0.03)] hover:border-primary-pink hover:bg-pink-50 hover:text-primary-pink hover:-translate-y-[1px]"
          data-prompt="ขั้นตอนขอผ่อนผันค่าเทอม">
          <i class="fa-regular fa-credit-card text-primary-pink text-xs"></i> ขั้นตอนขอผ่อนผันค่าเทอม
        </button>
        <button
          class="prompt-chip bg-white border border-slate-200 rounded-[20px] px-3.5 py-2 text-[13px] text-slate-700 whitespace-nowrap flex items-center gap-1.5 transition-all duration-200 shadow-[0_1px_2px_rgba(0,0,0,0.03)] hover:border-primary-pink hover:bg-pink-50 hover:text-primary-pink hover:-translate-y-[1px]"
          data-prompt="ตารางสอบปลายภาค">
          <i class="fa-regular fa-clock text-primary-pink text-xs"></i> ตารางสอบปลายภาค
        </button>
        <button
          class="prompt-chip bg-white border border-slate-200 rounded-[20px] px-3.5 py-2 text-[13px] text-slate-700 whitespace-nowrap flex items-center gap-1.5 transition-all duration-200 shadow-[0_1px_2px_rgba(0,0,0,0.03)] hover:border-primary-pink hover:bg-pink-50 hover:text-primary-pink hover:-translate-y-[1px]"
          data-prompt="ทุนการศึกษา ปี 2568">
          <i class="fa-solid fa-award text-primary-pink text-xs"></i> ทุนการศึกษา
        </button>
      </div>
    </div>

    <!-- Bottom Input Container -->
    <div class="px-6 py-3 pb-4 bg-chat-mainBg flex flex-col items-center gap-2 flex-shrink-0">
      <form
        class="w-full max-w-[900px] relative flex items-center bg-white border border-slate-200 rounded-[30px] py-1.5 pl-5 pr-2 shadow-[0_4px_12px_rgba(0,0,0,0.03)] transition-all duration-200 focus-within:border-primary-pink focus-within:shadow-[0_4px_16px_rgba(255,75,139,0.15)]"
        id="chat-form">
        <input type="text" id="user-input"
          class="flex-1 border-none outline-none bg-transparent font-sans text-[15px] text-slate-800 py-2 placeholder-slate-400"
          placeholder="พิมพ์ข้อความที่นี่" complete="off" />
        <button type="submit" id="btn-send"
          class="w-10 h-10 rounded-full bg-slate-400 text-white flex items-center justify-center text-base transition-all duration-200 flex-shrink-0 hover:scale-105 active:scale-95 focus:bg-primary-pink focus:shadow-[0_2px_8px_rgba(255,75,139,0.4)]"
          title="ส่งข้อความ">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
      <div class="text-[11.5px] text-slate-400 text-center mt-1">
        SSRU Chatbot อาจให้ข้อมูลที่ไม่ถูกต้อง โปรดตรวจสอบข้อมูลสำคัญอีกครั้ง
      </div>
    </div>
  </main>

  <script src="public/js/app.js"></script>
</body>

</html>
