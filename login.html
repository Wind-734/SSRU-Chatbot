<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>เข้าสู่ระบบ | SSRU Chatbot</title>

    <!-- Google Fonts: Prompt & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="public/css/style.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- ตั้งค่า Tailwind -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Prompt", "Kanit", "sans-serif"]
                    },
                    colors: {
                        primary: {
                            pink: "#F45BB0",
                            hover: "#E5499E"
                        },
                        page: {
                            background: "#F8FAFC"
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body.dark {
            background-color: #0F172A !important;
            color: #F8FAFC !important;
        }

        body.dark main section {
            background-color: #1E293B !important;
            border: 1px solid #334155 !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        }

        body.dark h1,
        body.dark label {
            color: #FFFFFF !important;
        }

        body.dark p,
        body.dark span.text-slate-400,
        body.dark .text-slate-500 {
            color: #94A3B8 !important;
        }

        body.dark input {
            background-color: #0F172A !important;
            border-color: #334155 !important;
            color: #FFFFFF !important;
        }

        body.dark input::placeholder {
            color: #94A3B8 !important;
        }

        body.dark input:focus {
            border-color: #F45BB0 !important;
            box-shadow: 0 0 0 3px rgba(244, 91, 176, 0.25) !important;
        }

        body.dark .bg-pink-50 {
            background-color: #334155 !important;
            color: #F45BB0 !important;
        }

        body.dark .fa-eye,
        body.dark .fa-eye-slash,
        body.dark .fa-user,
        body.dark .fa-lock {
            color: #94A3B8 !important;
        }
    </style>
    <script>
        if (localStorage.getItem("darkMode") === "true") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>

<body class="min-h-screen bg-page-background font-sans text-slate-800">

    <!-- พื้นที่หลักของหน้า Login -->
    <main class="min-h-screen flex items-center justify-center px-4 py-10">

        <!-- กล่อง Login -->
        <section class="w-full max-w-md rounded-2xl bg-white px-7 py-9 shadow-2xl sm:px-10">

            <!-- โลโก้และชื่อเว็บไซต์ -->
            <div class="mb-7 text-center">

                <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center
                           rounded-full bg-pink-50 text-2xl text-primary-pink">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>

                <h1 class="text-2xl font-semibold text-slate-900" data-i18n="site_title">
                    SSRU Chatbot
                </h1>

                <p class="mt-1 text-sm text-slate-500" data-i18n="university_name">
                    มหาวิทยาลัยราชภัฏสวนสุนันทา
                </p>

                <p class="text-xs text-slate-400" data-i18n="university_sub">
                    Suan Sunandha Rajabhat University
                </p>
            </div>

            <!-- แบบฟอร์มเข้าสู่ระบบ -->
            <form id="loginForm" class="space-y-5">

                <!-- ช่องรหัสนักศึกษา/อีเมล -->
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium text-slate-700" data-i18n="email_or_student_id">
                        รหัสนักศึกษา หรืออีเมล
                    </label>

                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2
                                   -translate-y-1/2 text-slate-400"></i>

                        <input type="text" id="email" name="email" placeholder="กรอกรหัสนักศึกษาหรืออีเมล" data-i18n-placeholder="placeholder_email_id"
                            autocomplete="username" required class="w-full rounded-lg border border-slate-300
                                   py-3 pl-11 pr-4 text-sm outline-none
                                   transition placeholder:text-slate-400
                                   focus:border-primary-pink
                                   focus:ring-2 focus:ring-pink-100">
                    </div>
                </div>

                <!-- ช่องรหัสผ่าน -->
                <div>
                    <div class="mb-2 flex items-center justify-between">

                        <label for="password" class="block text-sm font-medium text-slate-700" data-i18n="password">
                            รหัสผ่าน
                        </label>

                        <a href="#" class="text-xs font-medium text-primary-pink
                                   hover:text-primary-hover hover:underline" data-i18n="forgot_password">
                            ลืมรหัสผ่าน?
                        </a>
                    </div>

                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2
                                   -translate-y-1/2 text-slate-400"></i>

                        <input type="password" id="password" name="password" placeholder="กรอกรหัสผ่าน" data-i18n-placeholder="placeholder_password"
                            autocomplete="current-password" required class="w-full rounded-lg border border-slate-300
                                   py-3 pl-11 pr-12 text-sm outline-none
                                   transition placeholder:text-slate-400
                                   focus:border-primary-pink
                                   focus:ring-2 focus:ring-pink-100">

                        <!-- ปุ่มเปิด/ปิดรหัสผ่าน -->
                        <button type="button" id="togglePassword" aria-label="แสดงหรือซ่อนรหัสผ่าน" class="absolute right-4 top-1/2 -translate-y-1/2
                                   text-slate-400 transition
                                   hover:text-primary-pink">
                            <i id="passwordIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- ตัวเลือกจดจำการเข้าสู่ระบบ -->
                <label class="flex cursor-pointer items-center gap-2 text-sm text-slate-600">
                    <input type="checkbox" name="remember" class="h-4 w-4 rounded border-slate-300
                                accent-primary-pink">
                    <span data-i18n="remember_me">จดจำการเข้าสู่ระบบ</span>
                </label>

                <!-- ปุ่มเข้าสู่ระบบ -->
                <button type="submit" class="w-full rounded-lg bg-primary-pink px-4 py-3
                           font-medium text-white shadow-md transition
                           hover:bg-primary-hover hover:shadow-lg
                           focus:outline-none focus:ring-4 focus:ring-pink-200
                           active:scale-[0.99]">
                    <i class="fa-solid fa-right-to-bracket mr-2"></i>
                    <span data-i18n="login_title">เข้าสู่ระบบ</span>
                </button>

                <!-- กล่องข้อความแจ้งผลการเข้าสู่ระบบ -->
                <p id="loginMessage" role="status" class="hidden rounded-lg p-3 text-sm leading-relaxed"></p>
            </form>

            <!-- สมัครสมาชิก -->
            <p class="mt-6 text-center text-sm text-slate-500">
                <span data-i18n="no_account">ยังไม่มีบัญชี?</span>

                <a href="register.html" class="font-semibold text-primary-pink
                           hover:text-primary-hover hover:underline" data-i18n="register_now">
                    สมัครสมาชิก
                </a>
            </p>

        </section>
    </main>

    <!-- JavaScript สำหรับเปิดและปิดการแสดงรหัสผ่าน และเข้าสู่ระบบ -->
    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePasswordButton = document.getElementById("togglePassword");
        const passwordIcon = document.getElementById("passwordIcon");
        const loginMessage = document.getElementById("loginMessage");
        const rememberCheckbox = document.querySelector('input[name="remember"]');

        // ดึงรหัสนักศึกษา/อีเมลที่จำไว้มาเติมให้อัตโนมัติ
        const savedIdentifier = localStorage.getItem('recentLoginIdentifier') || localStorage.getItem('rememberedIdentifier');
        if (savedIdentifier) {
            emailInput.value = savedIdentifier;
            if (localStorage.getItem('rememberedIdentifier')) {
                rememberCheckbox.checked = true;
            }
        }

        togglePasswordButton.addEventListener("click", function () {
            const passwordIsHidden = passwordInput.type === "password";

            passwordInput.type = passwordIsHidden ? "text" : "password";

            passwordIcon.classList.toggle("fa-eye", !passwordIsHidden);
            passwordIcon.classList.toggle("fa-eye-slash", passwordIsHidden);
        });

        // ซ่อนกล่องข้อความเมื่อมีการพิมพ์ใหม่
        loginForm.addEventListener("input", () => {
            loginMessage.classList.add("hidden");
        });

        // ตรวจสอบการเข้าสู่ระบบกับฐานข้อมูล
        loginForm.addEventListener("submit", async function (e) {
            e.preventDefault();

            const identifier = emailInput.value.trim();
            const passwordVal = passwordInput.value;
            const submitBtn = loginForm.querySelector('button[type="submit"]');

            if (!identifier || !passwordVal) return;

            // แสดงสถานะกำลังตรวจสอบ
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังเข้าสู่ระบบ...';
            loginMessage.className = "rounded-lg bg-blue-50 text-blue-700 border border-blue-200 p-3 text-sm leading-relaxed";
            loginMessage.textContent = "กำลังตรวจสอบข้อมูลในระบบ...";
            loginMessage.classList.remove("hidden");

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        identifier: identifier,
                        password: passwordVal
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // จัดการตัวเลือกจดจำบัญชี
                    if (rememberCheckbox.checked) {
                        localStorage.setItem('rememberedIdentifier', identifier);
                    } else {
                        localStorage.removeItem('rememberedIdentifier');
                    }
                    localStorage.removeItem('recentLoginIdentifier');

                    // เก็บข้อมูลผู้ใช้ที่ล็อกอินปัจจุบันลง localStorage
                    localStorage.setItem('currentUser', JSON.stringify(data.user));

                    loginMessage.className = "rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 p-3 text-sm leading-relaxed font-medium";
                    loginMessage.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i> เข้าสู่ระบบสำเร็จ! ยินดีต้อนรับคุณ ${data.user.fullName}`;

                    setTimeout(() => {
                        window.location.href = "index.html";
                    }, 1000);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> เข้าสู่ระบบ';
                    loginMessage.className = "rounded-lg bg-rose-50 text-rose-700 border border-rose-200 p-3 text-sm leading-relaxed";
                    loginMessage.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-600 mr-1.5"></i> ${data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'}`;
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket mr-2"></i> เข้าสู่ระบบ';
                loginMessage.className = "rounded-lg bg-rose-50 text-rose-700 border border-rose-200 p-3 text-sm leading-relaxed";
                loginMessage.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1.5"></i> ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้ กรุณาลองใหม่อีกครั้ง';
            }
        });
    </script>
    <script src="setting.js"></script>

</body>

</html>
