<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Google Fonts: Prompt & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS ประจำโปรเจกต์ -->
    <link rel="stylesheet" href="public/css/style.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Prompt', 'Kanit', 'sans-serif'],
                    },
                    colors: {
                        sidebar: {
                            bg: '#0B132B',
                            hover: '#162244',
                            active: '#1C2B54',
                            text: '#FFFFFF',
                            title: '#94A3B8'
                        },
                        primary: {
                            pink: '#FF4B8B',
                            hover: '#E83B79',
                        },
                        chat: {
                            userBg: '#F78DA7',
                            mainBg: '#F8FAFC',
                        }
                    },
                    animation: {
                        'typing': 'typingBounce 1.4s infinite ease-in-out both',
                        'fade-in': 'fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        typingBounce: {
                            '0%, 80%, 100%': { transform: 'scale(0.6)', opacity: '0.5' },
                            '40%': { transform: 'scale(1)', opacity: '1' },
                        },
                        fadeIn: {
                            'from': { opacity: '0', transform: 'translateY(8px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Scrollbar Styles -->
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(203, 213, 225, 1);
            border-radius: 4px;
        }

        .sidebar-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .sidebar-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
    </style>
</head>

<body class="bg-chat-mainBg text-slate-800 font-sans h-screen overflow-hidden flex antialiased">

    <!-- ใส่เนื้อหาโครงสร้างหน้าเว็บที่นี่ -->

</body>

</html>
