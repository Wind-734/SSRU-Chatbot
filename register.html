<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก | SSRU Chatbot</title>

    <!-- ฟอนต์ภาษาไทย -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&family=Prompt:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- ไอคอน -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="stylesheet" href="public/css/style.css">

    <!-- Tailwind CSS สำหรับแสดงตัวอย่างหน้าเว็บ -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["Prompt", "Kanit", "sans-serif"]
                    },
                    colors: {
                        primary: {
                            pink: "#F45BB0",
                            hover: "#E5499E"
                        },
                        page: {
                            background: "#F8FAFC"
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body.dark {
            background-color: #0F172A !important;
            color: #F8FAFC !important;
        }

        body.dark main section {
            background-color: #1E293B !important;
            border: 1px solid #334155 !important;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5) !important;
        }

        body.dark h1,
        body.dark h2,
        body.dark label {
            color: #FFFFFF !important;
        }

        body.dark p,
        body.dark span.text-slate-400,
        body.dark .text-slate-500 {
            color: #94A3B8 !important;
        }

        body.dark input,
        body.dark select {
            background-color: #0F172A !important;
            border-color: #334155 !important;
            color: #FFFFFF !important;
        }

        body.dark input::placeholder {
            color: #94A3B8 !important;
        }

        body.dark input:focus,
        body.dark select:focus {
            border-color: #F45BB0 !important;
            box-shadow: 0 0 0 3px rgba(244, 91, 176, 0.25) !important;
        }

        body.dark select option {
            background-color: #1E293B !important;
            color: #FFFFFF !important;
        }

        body.dark .bg-pink-50 {
            background-color: #334155 !important;
            color: #F45BB0 !important;
        }

        body.dark .fa-eye,
        body.dark .fa-eye-slash,
        body.dark .fa-user,
        body.dark .fa-id-card,
        body.dark .fa-envelope,
        body.dark .fa-graduation-cap,
        body.dark .fa-lock {
            color: #94A3B8 !important;
        }
    </style>
    <script>
        if (localStorage.getItem("darkMode") === "true") {
            document.documentElement.classList.add("dark");
        }
    </script>
</head>

<body class="min-h-screen bg-page-background font-sans text-slate-800 antialiased">

    <main class="flex min-h-screen items-center justify-center px-4 py-10">

        <!-- กล่องสมัครสมาชิก -->
        <section
            aria-labelledby="registerTitle"
            class="w-full max-w-md rounded-2xl bg-white px-6 py-8 shadow-2xl sm:px-10">

            <!-- ชื่อเว็บไซต์ -->
            <header class="mb-7 text-center">
                <div
                    class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-pink-50 text-2xl text-primary-pink">
                    <i class="fa-solid fa-graduation-cap" aria-hidden="true"></i>
                </div>

                <h1 class="text-2xl font-semibold text-slate-900" data-i18n="site_title">
                    SSRU Chatbot
                </h1>

                <p class="mt-1 text-sm text-slate-500" data-i18n="university_name">
                    มหาวิทยาลัยราชภัฏสวนสุนันทา
                </p>

                <h2 id="registerTitle" class="mt-5 text-lg font-medium" data-i18n="register_title">
                    สมัครสมาชิก
                </h2>

                <p class="mt-1 text-xs text-slate-400" data-i18n="register_subtitle">
                    กรอกข้อมูลเพื่อสร้างบัญชีของคุณ
                </p>
            </header>

            <!-- แบบฟอร์มสมัครสมาชิก -->
            <form id="registerForm" class="space-y-4">

                <!-- ชื่อและนามสกุล -->
                <div>
                    <label for="fullName" class="mb-2 block text-sm font-medium" data-i18n="full_name">
                        ชื่อ–นามสกุล
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        autocomplete="name"
                        placeholder="กรอกชื่อและนามสกุล"
                        data-i18n-placeholder="placeholder_fullname"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-primary-pink focus:ring-2 focus:ring-pink-100">
                </div>

                <!-- รหัสนักศึกษา -->
                <div>
                    <label for="studentId" class="mb-2 block text-sm font-medium" data-i18n="student_id">
                        รหัสนักศึกษา
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        name="studentId"
                        inputmode="numeric"
                        pattern="[0-9]+"
                        title="กรอกรหัสนักศึกษาเป็นตัวเลขเท่านั้น"
                        placeholder="กรอกรหัสนักศึกษา"
                        data-i18n-placeholder="placeholder_student_id"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-primary-pink focus:ring-2 focus:ring-pink-100">
                </div>

                <!-- อีเมล -->
                <div>
                    <label for="email" class="mb-2 block text-sm font-medium" data-i18n="email">
                        อีเมล
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="เช่น student@ssru.ac.th"
                        data-i18n-placeholder="placeholder_reg_email"
                        required
                        class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-primary-pink focus:ring-2 focus:ring-pink-100">
                </div>

                <!-- รหัสผ่าน -->
                <div>
                    <label for="password" class="mb-2 block text-sm font-medium" data-i18n="password">
                        รหัสผ่าน
                    </label>

                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="new-password"
                            aria-describedby="passwordHint"
                            minlength="8"
                            placeholder="กรอกรหัสผ่าน"
                            data-i18n-placeholder="placeholder_password"
                            required
                            class="w-full rounded-lg border border-slate-300 py-3 pl-4 pr-12 text-sm outline-none transition placeholder:text-slate-400 focus:border-primary-pink focus:ring-2 focus:ring-pink-100">

                        <button
                            type="button"
                            data-password-toggle="password"
                            aria-controls="password"
                            aria-label="แสดงรหัสผ่าน"
                            aria-pressed="false"
                            class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-lg text-slate-400 hover:text-primary-pink focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-pink">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- ยืนยันรหัสผ่าน -->
                <div>
                    <label for="confirmPassword" class="mb-2 block text-sm font-medium" data-i18n="confirm_register_password">
                        ยืนยันรหัสผ่าน
                    </label>

                    <div class="relative">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            autocomplete="new-password"
                            minlength="8"
                            placeholder="กรอกยืนยันรหัสผ่าน"
                            data-i18n-placeholder="placeholder_confirm_reg_password"
                            required
                            class="w-full rounded-lg border border-slate-300 py-3 pl-4 pr-12 text-sm outline-none transition placeholder:text-slate-400 focus:border-primary-pink focus:ring-2 focus:ring-pink-100">

                        <button
                            type="button"
                            data-password-toggle="confirmPassword"
                            aria-controls="confirmPassword"
                            aria-label="แสดงรหัสผ่านยืนยัน"
                            aria-pressed="false"
                            class="absolute inset-y-0 right-0 flex w-12 items-center justify-center rounded-lg text-slate-400 hover:text-primary-pink focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-pink">
                            <i class="fa-solid fa-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                </div>

                <!-- ปุ่มสมัครสมาชิก -->
                <button
                    type="submit"
                    class="w-full rounded-lg bg-primary-pink px-4 py-3 font-medium text-white transition hover:bg-primary-hover focus:outline-none focus:ring-4 focus:ring-pink-200 active:scale-[0.99]"
                    data-i18n="btn_register">
                    สมัครสมาชิก
                </button>

                <!-- ข้อความแจ้งผลสำหรับหน้าตัวอย่าง -->
                <p
                    id="formMessage"
                    role="status"
                    class="hidden rounded-lg bg-slate-100 p-3 text-sm leading-relaxed text-slate-700">
                </p>
            </form>

            <!-- กลับไปหน้า Login -->
            <p class="mt-6 text-center text-sm text-slate-500">
                <span data-i18n="already_have_account">มีบัญชีอยู่แล้ว?</span>
                <a
                    href="login.html"
                    class="font-medium text-primary-pink hover:text-primary-hover hover:underline"
                    data-i18n="login_now">
                    เข้าสู่ระบบ
                </a>
            </p>

        </section>
    </main>

    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const formMessage = document.getElementById("formMessage");

        // เปิด–ปิดการแสดงรหัสผ่าน
        document.querySelectorAll("[data-password-toggle]").forEach((button) => {
            button.addEventListener("click", () => {
                const input = document.getElementById(
                    button.dataset.passwordToggle
                );
                const showPassword = input.type === "password";
                const icon = button.querySelector("i");
                const suffix = input.id === "confirmPassword" ? "ยืนยัน" : "";

                input.type = showPassword ? "text" : "password";
                button.setAttribute("aria-pressed", String(showPassword));
                button.setAttribute(
                    "aria-label",
                    (showPassword ? "ซ่อนรหัสผ่าน" : "แสดงรหัสผ่าน") + suffix
                );

                icon.classList.toggle("fa-eye", !showPassword);
                icon.classList.toggle("fa-eye-slash", showPassword);
            });
        });

        // ตรวจสอบว่ารหัสผ่านทั้งสองช่องตรงกัน
        function validatePasswords() {
            const mismatch =
                confirmPassword.value !== "" &&
                password.value !== confirmPassword.value;

            confirmPassword.setCustomValidity(
                mismatch ? "รหัสผ่านไม่ตรงกัน กรุณากรอกอีกครั้ง" : ""
            );
        }

        password.addEventListener("input", validatePasswords);
        confirmPassword.addEventListener("input", validatePasswords);

        form.addEventListener("input", () => {
            formMessage.classList.add("hidden");
        });

        // ส่งข้อมูลสมัครสมาชิกไปยังเซิร์ฟเวอร์และบันทึกลง MongoDB
        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            validatePasswords();

            if (!form.reportValidity()) {
                return;
            }

            const fullName = document.getElementById("fullName").value.trim();
            const studentId = document.getElementById("studentId").value.trim();
            const email = document.getElementById("email").value.trim();
            const passwordVal = password.value;
            const submitBtn = form.querySelector('button[type="submit"]');

            // แสดงสถานะกำลังบันทึก
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังบันทึกข้อมูล...';
            formMessage.className = "rounded-lg bg-blue-50 text-blue-700 border border-blue-200 p-3 text-sm leading-relaxed";
            formMessage.textContent = "กำลังเชื่อมต่อฐานข้อมูลเพื่อสร้างบัญชีผู้ใช้...";
            formMessage.classList.remove("hidden");

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        fullName,
                        studentId,
                        email,
                        password: passwordVal
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    formMessage.className = "rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 p-3 text-sm leading-relaxed font-medium";
                    formMessage.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i> สมัครสมาชิกสำเร็จเรียบร้อยแล้ว! กำลังนำคุณไปหน้าเข้าสู่ระบบ...';
                    
                    // บันทึกรหัสนักศึกษาไว้ให้ล่วงหน้าเพื่อให้หน้า login กรอกให้อัตโนมัติ
                    localStorage.setItem('recentLoginIdentifier', studentId);
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'สมัครสมาชิก';
                    formMessage.className = "rounded-lg bg-rose-50 text-rose-700 border border-rose-200 p-3 text-sm leading-relaxed";
                    formMessage.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-600 mr-1.5"></i> ${data.error || 'เกิดข้อผิดพลาดในการสมัครสมาชิก'}`;
                }
            } catch (err) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'สมัครสมาชิก';
                formMessage.className = "rounded-lg bg-rose-50 text-rose-700 border border-rose-200 p-3 text-sm leading-relaxed";
                formMessage.innerHTML = '<i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1.5"></i> ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบการเชื่อมต่อ';
            }
        });
    </script>
    <script src="setting.js"></script>

</body>

</html>
